# Vector centralizer tier — single Deployment in the logging namespace.
# Stage 3: receives from all agent pods via the Vector native protocol,
# enriches with pipeline metadata, and forwards to the egress tier.

data_dir: /vector-data-dir

# Accept log streams from every agent pod.
sources:
  agent_input:
    type: vector
    address: "0.0.0.0:6000"
    version: "2"

transforms:
  enrich_pipeline_metadata:
    type: remap
    inputs:
      - agent_input
    source: |
      # The agent already set cluster_name and carried kubernetes.* metadata.
      # Add a pipeline_tier tag so queries can filter to what the
      # centralizer specifically processed.
      .pipeline_tier = "centralizer"

sinks:
  egress:
    type: vector
    inputs:
      - enrich_pipeline_metadata
    address: "vector-egress.logging.svc.cluster.local:6000"
    version: "2"
    # Buffer to handle egress restarts without dropping events.
    buffer:
      type: memory
      max_events: 10000
      when_full: block
