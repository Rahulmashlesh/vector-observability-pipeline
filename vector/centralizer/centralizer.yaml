# Vector centralizer tier — single Deployment in the logging namespace.
# Stage 2: receives from all agent pods via the Vector native protocol,
# enriches with node-tier metadata, and writes to console (dummy sink).
# The console sink is replaced in Stage 3 with a vector sink forwarding
# to the egress tier.

data_dir: /vector-data-dir

# Accept log streams from every agent pod.
sources:
  agent_input:
    type: vector
    address: "0.0.0.0:6000"
    version: "2"

transforms:
  enrich_pipeline_metadata:
    type: remap
    inputs:
      - agent_input
    source: |
      # The agent already set cluster_name and carried kubernetes.* metadata.
      # Add a pipeline_tier tag so queries can filter to what the
      # centralizer specifically processed (useful for debugging fan-in).
      .pipeline_tier = "centralizer"

sinks:
  console:
    type: console
    inputs:
      - enrich_pipeline_metadata
    encoding:
      codec: json
