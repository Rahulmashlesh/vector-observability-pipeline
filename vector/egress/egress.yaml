# Vector egress tier — single Deployment in the logging namespace.
# Stage 3: receives from the centralizer, stamps pipeline_tier=egress,
# strips redundant fields, and ships to Loki via the HTTP push API.
#
# Metadata fields (namespace, pod_name, node_name, container, container_image,
# stream, app, cluster_name) are pre-flattened by the agent tier — the raw
# .kubernetes.* blob is therefore redundant and stripped here before storage.

data_dir: /vector-data-dir

api:
  enabled: true
  address: "0.0.0.0:8686"

sources:
  centralizer_input:
    type: vector
    address: "0.0.0.0:6000"
    version: "2"

transforms:
  enrich_egress_metadata:
    type: remap
    inputs:
      - centralizer_input
    source: |
      # Mark which tier produced this event.
      .pipeline_tier = "egress"

      # Ensure a string message field for Loki.
      if !exists(.message) || is_null(.message) {
        .message = encode_json(.)
      }

      # Strip fields that are redundant or not useful in stored logs:
      #
      #  .kubernetes   — the full nested metadata blob; every useful field
      #                  (namespace, pod_name, node_name, container,
      #                   container_image, app, stream) was already flattened
      #                  to top-level by the agent. Storing both wastes ~80%
      #                  of each event's bytes.
      #  .file         — raw host path (/var/log/pods/.../N.log); meaningless
      #                  once the log is in Loki.
      #  .source_type  — always "kubernetes_logs"; adds nothing.
      del(.kubernetes)
      del(.file)
      del(.source_type)

sinks:
  loki:
    type: loki
    inputs:
      - enrich_egress_metadata
    endpoint: "http://loki.monitoring.svc.cluster.local:3100"
    encoding:
      codec: json
    labels:
      cluster: "endurance"
      namespace: "{{ namespace }}"
      pod: "{{ pod_name }}"
      container: "{{ container }}"
      node: "{{ node_name }}"
      app: "{{ app }}"
      stream: "{{ stream }}"
      pipeline_tier: "egress"
    batch:
      max_bytes: 1048576
      timeout_secs: 5
    request:
      retry_attempts: 5
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 30
    buffer:
      type: disk
      max_size: 536870912  # 512 MB
      when_full: block
