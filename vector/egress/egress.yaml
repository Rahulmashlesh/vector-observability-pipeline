# Vector egress tier — single Deployment in the logging namespace.
# Stage 3: receives from the centralizer, stamps pipeline_tier=egress,
# and ships to Loki via the HTTP push API.
#
# Metadata fields (namespace, pod_name, node_name, container, container_image,
# stream, app, cluster_name) are pre-flattened by the agent tier — no
# secondary extraction needed here.

data_dir: /vector-data-dir

api:
  enabled: true
  address: "0.0.0.0:8686"

# Accept log streams from the centralizer.
sources:
  centralizer_input:
    type: vector
    address: "0.0.0.0:6000"
    version: "2"

transforms:
  enrich_egress_metadata:
    type: remap
    inputs:
      - centralizer_input
    source: |
      # Mark which tier produced this event.
      .pipeline_tier = "egress"

      # Loki requires a string message field. Use the existing message if
      # present, otherwise JSON-encode the full event as the log line.
      if !exists(.message) || is_null(.message) {
        .message = encode_json(.)
      }

sinks:
  loki:
    type: loki
    inputs:
      - enrich_egress_metadata
    endpoint: "http://loki.monitoring.svc.cluster.local:3100"
    encoding:
      codec: json
    # Labels indexed by Loki for fast filtering in Grafana.
    # app + namespace are the two most useful for dashboard queries.
    labels:
      cluster: "endurance"
      namespace: "{{ namespace }}"
      pod: "{{ pod_name }}"
      container: "{{ container }}"
      node: "{{ node_name }}"
      app: "{{ app }}"
      stream: "{{ stream }}"
      pipeline_tier: "egress"
    # Batch for efficiency — flush every 5s or when 1 MB is accumulated.
    batch:
      max_bytes: 1048576
      timeout_secs: 5
    # Retry on transient Loki errors.
    request:
      retry_attempts: 5
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 30
    # Buffer to disk so a Loki restart doesn't drop events.
    buffer:
      type: disk
      max_size: 536870912  # 512 MB
      when_full: block
