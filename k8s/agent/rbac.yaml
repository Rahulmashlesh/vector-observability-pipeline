# Vector agent needs read access to pods, namespaces, and nodes
# so it can enrich log lines with Kubernetes metadata.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-agent
  namespace: logging
  labels:
    app.kubernetes.io/name: vector-agent
    app.kubernetes.io/part-of: vector-observability-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-agent
  labels:
    app.kubernetes.io/name: vector-agent
    app.kubernetes.io/part-of: vector-observability-pipeline
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-agent
  labels:
    app.kubernetes.io/name: vector-agent
    app.kubernetes.io/part-of: vector-observability-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-agent
subjects:
  - kind: ServiceAccount
    name: vector-agent
    namespace: logging
