apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-agent
  namespace: logging
  labels:
    app.kubernetes.io/name: vector-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: vector-observability-pipeline
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: vector-observability-pipeline
    spec:
      serviceAccountName: vector-agent

      # Tolerate control-plane nodes so the DaemonSet runs on node3 (master).
      # node2 is NotReady+tainted (reserved:NoExecute) and will be excluded.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

      containers:
        - name: vector
          image: timberio/vector:0.42.0-distroless-static
          args:
            - --config
            - /etc/vector/agent.yaml
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VECTOR_SELF_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            # Host log directories: Vector reads container logs from here.
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib-rancher
              mountPath: /var/lib/rancher
              readOnly: true
            # Data directory: Vector writes file position checkpoints here.
            # Must match data_dir in agent.yaml.
            - name: vector-data
              mountPath: /vector-data-dir
          securityContext:
            runAsUser: 0          # Required to read host log files
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false

      volumes:
        - name: config
          configMap:
            name: vector-agent-config
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib-rancher
          hostPath:
            path: /var/lib/rancher
        - name: vector-data
          hostPath:
            path: /var/lib/vector-agent
            type: DirectoryOrCreate

      terminationGracePeriodSeconds: 60
