apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-egress-config
  namespace: logging
  labels:
    app.kubernetes.io/name: vector-egress
    app.kubernetes.io/part-of: vector-observability-pipeline
data:
  egress.yaml: |
    data_dir: /vector-data-dir

    api:
      enabled: true
      address: "0.0.0.0:8686"

    sources:
      centralizer_input:
        type: vector
        address: "0.0.0.0:6000"
        version: "2"

    transforms:
      enrich_egress_metadata:
        type: remap
        inputs:
          - centralizer_input
        source: |
          .pipeline_tier = "egress"

          if !exists(.message) || is_null(.message) {
            .message = encode_json(.)
          }

          .kubernetes.namespace = to_string(.kubernetes.namespace_labels."kubernetes.io/metadata.name") ?? to_string(.kubernetes.pod_namespace) ?? "unknown"
          .kubernetes.pod = to_string(.kubernetes.pod_name) ?? "unknown"
          .kubernetes.container = to_string(.kubernetes.container_name) ?? "unknown"
          .kubernetes.node = to_string(.kubernetes.pod_node_name) ?? to_string(."node_name") ?? "unknown"

    sinks:
      loki:
        type: loki
        inputs:
          - enrich_egress_metadata
        endpoint: "http://loki.monitoring.svc.cluster.local:3100"
        encoding:
          codec: json
        labels:
          cluster: "endurance"
          namespace: "{{ kubernetes.namespace }}"
          pod: "{{ kubernetes.pod }}"
          container: "{{ kubernetes.container }}"
          node: "{{ kubernetes.node }}"
          pipeline_tier: "egress"
        batch:
          max_bytes: 1048576
          timeout_secs: 5
        request:
          retry_attempts: 5
          retry_initial_backoff_secs: 1
          retry_max_duration_secs: 30
        buffer:
          type: disk
          max_size: 536870912
          when_full: block
