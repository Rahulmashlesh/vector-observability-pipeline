apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-egress-config
  namespace: logging
  labels:
    app.kubernetes.io/name: vector-egress
    app.kubernetes.io/part-of: vector-observability-pipeline
data:
  egress.yaml: |
    data_dir: /vector-data-dir

    api:
      enabled: true
      address: "0.0.0.0:8686"

    sources:
      centralizer_input:
        type: vector
        address: "0.0.0.0:6000"
        version: "2"

    transforms:
      enrich_egress_metadata:
        type: remap
        inputs:
          - centralizer_input
        source: |
          .pipeline_tier = "egress"

          if !exists(.message) || is_null(.message) {
            .message = encode_json(.)
          }

    sinks:
      loki:
        type: loki
        inputs:
          - enrich_egress_metadata
        endpoint: "http://loki.monitoring.svc.cluster.local:3100"
        encoding:
          codec: json
        labels:
          cluster: "endurance"
          namespace: "{{ namespace }}"
          pod: "{{ pod_name }}"
          container: "{{ container }}"
          node: "{{ node_name }}"
          app: "{{ app }}"
          stream: "{{ stream }}"
          pipeline_tier: "egress"
        batch:
          max_bytes: 1048576
          timeout_secs: 5
        request:
          retry_attempts: 5
          retry_initial_backoff_secs: 1
          retry_max_duration_secs: 30
        buffer:
          type: disk
          max_size: 536870912
          when_full: block
