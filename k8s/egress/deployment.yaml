apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-egress
  namespace: logging
  labels:
    app.kubernetes.io/name: vector-egress
    app.kubernetes.io/part-of: vector-observability-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vector-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector-egress
        app.kubernetes.io/part-of: vector-observability-pipeline
    spec:
      # Prefer a non-control-plane node with enough memory
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vector
          image: timberio/vector:0.62.0-debian
          args:
            - "--config"
            - "/etc/vector/egress.yaml"
          ports:
            - containerPort: 6000
              name: vector
          env:
            - name: VECTOR_LOG
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: data
              mountPath: /vector-data-dir
            - name: newrelic-license
              mountPath: /etc/vector-secrets/newrelic
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8686
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8686
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: vector-egress-config
        - name: data
          emptyDir: {}
        # Secret must be created manually (see README); never committed.
        - name: newrelic-license
          secret:
            secretName: newrelic-license
