---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - observability.endurance.io
  resources:
  - logpipelines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - observability.endurance.io
  resources:
  - logpipelines/finalizers
  verbs:
  - update
- apiGroups:
  - observability.endurance.io
  resources:
  - logpipelines/status
  verbs:
  - get
  - patch
  - update
